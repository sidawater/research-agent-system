appId: com.research.agent
productName: Research Agent
directories:
  output: release
extraResources:
  - from: dist
    to: dist
    filter:
      - "**/*"
files:
  - dist-electron/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
